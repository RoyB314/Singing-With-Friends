<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danny Boy — Choir Parts</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <nav class="site-nav"><a href="index.html">&larr; All songs</a></nav>

  <h1 class="piece-title">Danny Boy</h1>
  <p class="piece-meta">Tap a track below to play it</p>

  <div class="player">
    <p class="now-playing" data-role="now-playing">No track selected</p>
    <div class="player-row">
      <button class="play-btn" data-role="play" aria-label="Play/pause">&#9654;</button>
      <input type="range" class="seek" data-role="seek" min="0" max="100" value="0" aria-label="Seek">
      <span class="time" data-role="time">0:00</span>
    </div>
    <div class="player-row">
      <span class="vol-label">Volume</span>
      <input type="range" class="volume" data-role="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </div>

  <audio id="player" preload="none"></audio>

  <div class="track-grid">
      <p class="group-label">Sections</p>
      <button class="track-btn" data-src="audio/danny-boy-soprano-1.mp3" data-label="Soprano 1">Soprano 1</button>
      <button class="track-btn" data-src="audio/danny-boy-soprano-2.mp3" data-label="Soprano 2">Soprano 2</button>
      <button class="track-btn" data-src="audio/danny-boy-alto-1.mp3" data-label="Alto 1">Alto 1</button>
      <button class="track-btn" data-src="audio/danny-boy-alto-2.mp3" data-label="Alto 2">Alto 2</button>
      <button class="track-btn" data-src="audio/danny-boy-tenor-1.mp3" data-label="Tenor 1">Tenor 1</button>
      <button class="track-btn" data-src="audio/danny-boy-tenor-2.mp3" data-label="Tenor 2">Tenor 2</button>
      <button class="track-btn" data-src="audio/danny-boy-bass-1.mp3" data-label="Bass 1">Bass 1</button>
      <button class="track-btn" data-src="audio/danny-boy-bass-2.mp3" data-label="Bass 2">Bass 2</button>
      <p class="group-label">Full Ensemble & Accompaniment</p>
      <button class="track-btn" data-src="audio/danny-boy-full-mix.mp3" data-label="Full Mix">Full Mix</button>
      <button class="track-btn" data-src="audio/danny-boy-guide-piano.mp3" data-label="Guide Piano">Guide Piano</button>
  </div>

    <p class="group-label large">Video Practice with Score</p>
  <div class="song-grid">
    <a class="song-btn" href="https://www.youtube.com/watch?v=G5Lu4JWDGCQ" target="_blank" rel="noopener">Soprano 1</a>
    <a class="song-btn" href="https://www.youtube.com/watch?v=5llSAUL_Fdc" target="_blank" rel="noopener">Soprano 2</a>
    <a class="song-btn" href="https://www.youtube.com/watch?v=zsUe6j2ahIA" target="_blank" rel="noopener">Alto 1</a>
    <a class="song-btn" href="https://www.youtube.com/watch?v=C38y39eL7cI" target="_blank" rel="noopener">Alto 2</a>
    <a class="song-btn" href="https://www.youtube.com/watch?v=tInn1gidjDE" target="_blank" rel="noopener">Tenor 1 (same as Tenor 2 for now)</a>
    <a class="song-btn" href="https://www.youtube.com/watch?v=tInn1gidjDE" target="_blank" rel="noopener">Tenor 2</a>
    <a class="song-btn" href="https://www.youtube.com/watch?v=c7dzBDogcgM" target="_blank" rel="noopener">Bass 1</a>
    <a class="song-btn" href="https://www.youtube.com/watch?v=O9TEaPIkahA" target="_blank" rel="noopener">Bass 2</a>
    <a class="song-btn" href="https://www.youtube.com/watch?v=g5p_bZ-QSrU" target="_blank" rel="noopener">Full Ensemble</a>
  </div>

</div>

<script src="player.js"></script>
</body>
</html>
