<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lean on Me — Choir Parts</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <nav class="site-nav"><a href="index.html">&larr; All songs</a></nav>

  <h1 class="piece-title">Lean on Me</h1>
  <p class="piece-meta">Tap a track below to play it</p>

  <div class="player">
    <p class="now-playing" data-role="now-playing">No track selected</p>
    <div class="player-row">
      <button class="play-btn" data-role="play" aria-label="Play/pause">&#9654;</button>
      <input type="range" class="seek" data-role="seek" min="0" max="100" value="0" aria-label="Seek">
      <span class="time" data-role="time">0:00</span>
    </div>
    <div class="player-row">
      <span class="vol-label">Volume</span>
      <input type="range" class="volume" data-role="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </div>

  <audio id="player" preload="none"></audio>

  <div class="track-grid">
      <p class="group-label">Sections</p>
      <button class="track-btn" data-src="audio/lean-on-me-soprano-1-muted.mp3" data-label="Soprano 1 – Muted">Soprano 1 – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-soprano-1-predominant.mp3" data-label="Soprano 1 – Predominant">Soprano 1 – Predominant</button>
      <button class="track-btn" data-src="audio/lean-on-me-soprano-2-muted.mp3" data-label="Soprano 2 – Muted">Soprano 2 – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-soprano-2-predominant.mp3" data-label="Soprano 2 – Predominant">Soprano 2 – Predominant</button>
      <button class="track-btn" data-src="audio/lean-on-me-alto-1-muted.mp3" data-label="Alto 1 – Muted">Alto 1 – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-alto-1-predominant.mp3" data-label="Alto 1 – Predominant">Alto 1 – Predominant</button>
      <button class="track-btn" data-src="audio/lean-on-me-alto-2-muted.mp3" data-label="Alto 2 – Muted">Alto 2 – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-alto-2-predominant.mp3" data-label="Alto 2 – Predominant">Alto 2 – Predominant</button>
      <button class="track-btn" data-src="audio/lean-on-me-tenor-1-muted.mp3" data-label="Tenor 1 – Muted">Tenor 1 – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-tenor-1-predominant.mp3" data-label="Tenor 1 – Predominant">Tenor 1 – Predominant</button>
      <button class="track-btn" data-src="audio/lean-on-me-tenor-2-muted.mp3" data-label="Tenor 2 – Muted">Tenor 2 – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-tenor-2-predominant.mp3" data-label="Tenor 2 – Predominant">Tenor 2 – Predominant</button>
      <button class="track-btn" data-src="audio/lean-on-me-solo-1-muted.mp3" data-label="Solo 1 – Muted">Solo 1 – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-solo-1-predominant.mp3" data-label="Solo 1 – Predominant">Solo 1 – Predominant</button>
      <button class="track-btn" data-src="audio/lean-on-me-solo-2-muted.mp3" data-label="Solo 2 – Muted">Solo 2 – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-solo-2-predominant.mp3" data-label="Solo 2 – Predominant">Solo 2 – Predominant</button>
      <button class="track-btn" data-src="audio/lean-on-me-bass-muted.mp3" data-label="Bass – Muted">Bass – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-bass-predominant.mp3" data-label="Bass – Predominant">Bass – Predominant</button>
      <button class="track-btn" data-src="audio/lean-on-me-small-group-muted.mp3" data-label="Small Group – Muted">Small Group – Muted</button>
      <button class="track-btn" data-src="audio/lean-on-me-small-group-predominant.mp3" data-label="Small Group – Predominant">Small Group – Predominant</button>
      <p class="group-label">Full Ensemble</p>
      <button class="track-btn" data-src="audio/lean-on-me-balanced-voices.mp3" data-label="Balanced Voices">Balanced Voices</button>
  </div>

</div>

<script src="player.js"></script>
</body>
</html>
