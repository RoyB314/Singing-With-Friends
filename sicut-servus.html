<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sicut Servus — Choir Parts</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <nav class="site-nav"><a href="index.html">&larr; All songs</a></nav>

  <h1 class="piece-title">Sicut Servus</h1>
  <p class="piece-meta">Tap a track below to play it</p>

  <div class="player">
    <p class="now-playing" data-role="now-playing">No track selected</p>
    <div class="player-row">
      <button class="play-btn" data-role="play" aria-label="Play/pause">&#9654;</button>
      <input type="range" class="seek" data-role="seek" min="0" max="100" value="0" aria-label="Seek">
      <span class="time" data-role="time">0:00</span>
    </div>
    <div class="player-row">
      <span class="vol-label">Volume</span>
      <input type="range" class="volume" data-role="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </div>

  <audio id="player" preload="none"></audio>

  <div class="track-grid">
      <p class="group-label">Sections</p>
      <button class="track-btn" data-src="audio/sicut-servus-soprano.mp3" data-label="Soprano">Soprano</button>
      <button class="track-btn" data-src="audio/sicut-servus-alto.mp3" data-label="Alto">Alto</button>
      <button class="track-btn" data-src="audio/sicut-servus-tenor.mp3" data-label="Tenor">Tenor</button>
      <button class="track-btn" data-src="audio/sicut-servus-bass.mp3" data-label="Bass">Bass</button>
  </div>

</div>

<script src="player.js"></script>
</body>
</html>
